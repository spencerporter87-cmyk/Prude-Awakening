name: Publish model files

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/models.yml"]

permissions:
  contents: write

jobs:
  nudenet:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch NudeNet 640m and check it
        run: |
          ok=0
          for u in \
            https://huggingface.co/deepghs/nudenet_onnx/resolve/main/640m.onnx \
            https://huggingface.co/alexgenovese/checkpoint/resolve/main/640m.onnx \
            https://huggingface.co/spaces/xxparthparekhxx/NudeNet-FastAPI/resolve/main/640m.onnx \
            https://huggingface.co/spaces/amirgame197/SFW-Converter/resolve/main/640m.onnx \
            https://github.com/notAI-tech/NudeNet/releases/download/v3.4-weights/640m.onnx; do
            echo "try $u"
            curl -sSL -o 640m.onnx -w "status %{http_code}, %{size_download} bytes\n" "$u" || true
            if [ -f 640m.onnx ] && [ "$(stat -c%s 640m.onnx)" -gt 50000000 ]; then ok=1; echo "got it from $u"; break; fi
          done
          [ "$ok" = 1 ] || { echo "could not fetch 640m.onnx"; ls -la; exit 1; }
          pip install onnxruntime
          python -c "import onnxruntime as o; s=o.InferenceSession('640m.onnx'); i=s.get_inputs()[0]; out=s.get_outputs()[0]; print('input', i.name, i.shape, 'output', out.name, out.shape); assert out.shape[1]==22, 'not the NudeNet 640m model'"
          sha256sum 640m.onnx
          pip install "nudenet>=3.4" opencv-python-headless
          python - <<'PY'
          import numpy as np, cv2, time
          from nudenet import NudeDetector
          img = (np.random.rand(480, 854, 3) * 255).astype("uint8")
          cv2.imwrite("t.jpg", img)
          d = NudeDetector(model_path="640m.onnx", inference_resolution=640)
          t = time.perf_counter(); r = d.detect("t.jpg"); dt = time.perf_counter() - t
          print("640m detect ok:", r, f"{dt:.2f}s")
          t = time.perf_counter(); r2 = NudeDetector().detect("t.jpg"); print("320n detect ok:", r2, f"{time.perf_counter()-t:.2f}s")
          PY
          cp 640m.onnx nudenet-640m.onnx
      - name: Publish to the models-v1 release
        run: |
          gh release view models-v1 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create models-v1 -R "$GITHUB_REPOSITORY" --prerelease --title "Model files" \
              --notes "AI model files the app downloads on first use."
          gh release upload models-v1 nudenet-640m.onnx -R "$GITHUB_REPOSITORY" --clobber
