name: Tests (Linux, quick)

# Runs on every push. Linux runners cost half of Windows ones and this finishes in a few minutes.
# The slow Windows job (installer, packaged self-test, screenshots) only runs when asked: see build.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The same FFmpeg builds the Windows job uses (the tests check exact keyframe/cut behaviour, which
      # differs between FFmpeg builds; Ubuntu's own package behaves differently).
      - name: FFmpeg (BtbN build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api repos/BtbN/FFmpeg-Builds/releases/latest --jq '[.assets[] | select(.name | test("^ffmpeg-n[0-9]+\\.[0-9]+-latest-linux64-gpl-[0-9.]+\\.tar\\.xz$"))] | sort_by(.name | capture("^ffmpeg-n(?<a>[0-9]+)\\.(?<b>[0-9]+)") | [(.a|tonumber),(.b|tonumber)]) | last | .browser_download_url')
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          fi
          echo "Using $url"
          curl -fsSL "$url" -o ffmpeg.tar.xz
          mkdir ffmpeg-x && tar -xf ffmpeg.tar.xz -C ffmpeg-x --strip-components=1
          sudo install -m 755 ffmpeg-x/bin/ffmpeg ffmpeg-x/bin/ffprobe /usr/local/bin/
          ffmpeg -version | head -1
      - name: Python packages
        run: pip install numpy onnxruntime opencv-python-headless pillow pyyaml requests pytest
      - name: Unit tests
        run: python -m pytest tests -q
