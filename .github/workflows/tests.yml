name: Tests (Linux, quick)

# Runs on every push. Linux runners cost half of Windows ones and this finishes in a few minutes.
# The slow Windows job (installer, packaged self-test, screenshots) only runs when asked: see build.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Python packages
        run: pip install numpy onnxruntime opencv-python-headless pillow pyyaml requests pytest
      - name: Unit tests
        run: python -m pytest tests -q
