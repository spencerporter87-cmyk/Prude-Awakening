name: Build and test (Windows)

# The full Windows build is slow, so it no longer runs on every push (tests.yml does that, on Linux).
# Run it when you want a new installer: Actions > "Build and test (Windows)" > Run workflow,
# or push a tag like v3.6.0 to publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
          # Text recognition for picture subtitles. --no-deps: it would pull in the full
          # opencv-python next to the headless one we already have.
          pip install --no-deps "rapidocr_onnxruntime>=1.3,<1.5"
          pip install pyclipper shapely pyyaml six pillow
          python -c "from rapidocr_onnxruntime import RapidOCR; RapidOCR(); print('OCR ok')"

      - name: Get FFmpeg
        shell: pwsh
        run: ./packaging/get_ffmpeg.ps1

      - name: Prepare the nudity second-opinion model (published once)
        continue-on-error: true
        shell: pwsh
        run: |
          $have = gh release view models-v1 --json assets --jq '.assets[].name' 2>$null
          if (($have -join " ") -match "marqo-nsfw-384.onnx" -and ($have -join " ") -match "marqo-nsfw-384.json") {
            Write-Host "Model files already published."; exit 0 }
          pip install torch timm onnx onnxscript
          python packaging/make_nsfw_model.py out/nsfw
          if ($LASTEXITCODE -ne 0) { throw "model conversion failed" }
          gh release view models-v1 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create models-v1 --prerelease --title "Model files" --notes "AI model files the app downloads on first use. Marqo/nsfw-image-detection-384 (Apache-2.0) converted to ONNX." }
          gh release upload models-v1 out/nsfw/marqo-nsfw-384.onnx out/nsfw/marqo-nsfw-384.json --clobber

      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: out/models
          key: models-v1

      - name: Unit tests
        run: python -m pytest tests -q

      - name: End-to-end test (real speech, real models)
        run: python tests/e2e_windows.py out/e2e

      - name: Screenshot tour (from source)
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList "-m","prude.gui","--tour","`"$PWD/out/screens`"","--video","`"$PWD/out/e2e/e2e movie.mkv`"" -WorkingDirectory src -PassThru -Wait -NoNewWindow
          Get-ChildItem out/screens
          if ($p.ExitCode -ne 0) { throw "tour failed $($p.ExitCode)" }

      - name: Build PrudeAwakening.exe
        run: pyinstaller packaging/prude.spec --noconfirm --distpath dist --workpath build

      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $p = Start-Process dist/PrudeAwakening/PrudeAwakening.exe -ArgumentList "--self-test","$PWD/out/selftest.json" -PassThru -Wait
          Get-Content out/selftest.json
          if ($p.ExitCode -ne 0) { throw "self-test failed" }
          $p = Start-Process dist/PrudeAwakening/PrudeAwakening.exe -ArgumentList "--tour","$PWD/out/screens-packaged","--video","`"$PWD/out/e2e/e2e movie.mkv`"" -PassThru -Wait
          Get-ChildItem out/screens-packaged
          Get-Content out/screens-packaged/media.json
          $m = Get-Content out/screens-packaged/media.json | ConvertFrom-Json
          if (-not $m.have_multimedia -or $m.review_duration -lt 1) { throw "built-in player could not open the movie" }
          $mv = "$PWD/out/e2e/packaged test.mkv"; Copy-Item "out/e2e/e2e movie.mkv" $mv
          $env:PRUDE_CONSOLE_LOG = "$PWD/out/packaged-console.log"
          $p = Start-Process dist/PrudeAwakening/PrudeAwakening.exe -PassThru -ArgumentList "--cli","`"$mv`"","--words","strong,blasphemy,mild","--model","tiny.en","--device","cpu","--scenes","nudity,violence","--describe","`"a colorful television test pattern`"","--action","blur_parts","--models-dir","`"$PWD/out/models`"","--summary-json","`"$PWD/out/packaged-summary.json`""
          if (-not $p.WaitForExit(900000)) { Get-Content out/packaged-console.log; Stop-Process -Id $p.Id -Force; throw "packaged scan timed out" }
          Get-Content out/packaged-console.log
          if ($p.ExitCode -ne 0) { throw "packaged scan failed $($p.ExitCode)" }
          $j = Get-Content out/packaged-summary.json | ConvertFrom-Json
          Write-Host "Packaged app found $($j.mutes.Count) mutes, $($j.scenes.Count) scenes -> $($j.result.output) ($($j.result.how))"
          if ($j.mutes.Count -lt 2 -or -not (Test-Path $j.result.output)) { throw "packaged scan gave wrong results" }
          $size = (Get-ChildItem dist/PrudeAwakening -Recurse | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("Packaged app size: {0:N0} MB" -f $size)

      - name: Build installer
        shell: pwsh
        run: |
          $v = (Select-String -Path src/prude/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$v" packaging/installer.iss
          Get-ChildItem dist/*.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Prude-Awakening-Setup
          path: dist/Prude-Awakening-Setup-*.exe
          retention-days: 30

      - name: Upload screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-and-results
          path: |
            out/screens
            out/screens-packaged
            out/e2e/*.json
            out/e2e/*.srt
            out/selftest.json
            out/packaged-summary.json
          retention-days: 14

      - name: Save screenshots and results to the ci-results branch
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-results | Out-Null
          foreach ($p in "out/screens","out/screens-packaged","out/selftest.json","out/packaged-summary.json","out/packaged-console.log","out/e2e/e2e-summary.json","out/e2e/*.srt") {
            if (Test-Path $p) { Copy-Item $p ci-results -Recurse -Force } }
          Set-Location ci-results
          git init -q -b ci-results
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add -A; git commit -qm "Results for $env:GITHUB_SHA"
          git push -f -q "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY" ci-results

      - name: Publish "Latest build" download
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          gh release delete latest-build --cleanup-tag -y 2>$null
          $f = Get-ChildItem dist/Prude-Awakening-Setup-*.exe | Select-Object -First 1
          gh release create latest-build $f.FullName --prerelease --target $env:GITHUB_SHA --title "Latest build" --notes "Automatic build of the newest code. Download Prude-Awakening-Setup below and run it."
          # a release has once ended up as a draft (its download link then says "Not found"): make sure it is public
          gh release edit latest-build --draft=false --prerelease

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Prude-Awakening-Setup-*.exe
